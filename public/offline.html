<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f3790">
    <title>Offline - Grace Daily Contribution</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; background: #1f3790; color: #fff; text-align: center;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 360px; }
        svg { width: 88px; height: 88px; }
        h1 { margin: 24px 0 8px; font-size: 24px; }
        p { margin: 0; color: #c0d1ff; line-height: 1.5; }
        button {
            margin-top: 28px; padding: 14px 28px; border: 0; border-radius: 12px;
            background: #fff; color: #1f3790; font: inherit; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M50.4 13.6A26 26 0 1 0 58 33H48.5" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <g fill="#c0d1ff" transform="translate(-2 0)"><circle cx="23" cy="24.5" r="3.4"/><circle cx="31" cy="21.5" r="3.9"/><circle cx="39" cy="24.5" r="3.4"/><path d="M18.5 37v-4.5a4.5 4.5 0 0 1 9 0V37z"/><path d="M26 37v-6a5 5 0 0 1 10 0v6z"/><path d="M34.5 37v-4.5a4.5 4.5 0 0 1 9 0V37z"/></g>
            <path transform="translate(-2 0)" d="M15 40.5c5 4.5 12 6 19 4.5 3-.6 5.5-2 7.5-3.5" stroke="#c0d1ff" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
        <h1>You're offline</h1>
        <p>Grace Daily Contribution needs an internet connection to load balances and save entries. Check your data or Wi-Fi and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
